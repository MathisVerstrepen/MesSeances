name: Go CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  checks:
    name: Go CI / checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -tags=nodynamic
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Prepare application dependencies
        run: go mod download

      - name: Install pinned test reporter
        working-directory: .
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate.py install-tools --tool gotestsum

      - name: Test
        working-directory: .
        run: make test-go

      - name: Vet
        run: go vet ./...

      - name: Race test
        working-directory: .
        run: make test-race

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
          work-dir: api
          go-package: ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          working-directory: api

  integration:
    name: Go CI / integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: Prepare application dependencies
        working-directory: api
        run: go mod download
      - name: Install pinned test reporter
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate.py install-tools --tool gotestsum
      - name: PostgreSQL integration tests
        run: make test-integration

name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
          work-dir: api
          go-package: ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: movieflow
          POSTGRES_USER: movieflow
          POSTGRES_PASSWORD: movieflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U movieflow -d movieflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://movieflow:movieflow@localhost:5432/movieflow?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache: true
          cache-dependency-path: api/go.sum
      - name: PostgreSQL integration tests
        working-directory: api
        run: go test ./internal/database ./internal/schedulepg ./internal/enrichment ./internal/synccontrol ./internal/syncschedule -run 'Integration$' -count=1

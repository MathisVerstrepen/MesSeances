name: Publish release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write
  pull-requests: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.merged == true
    name: Create tag and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: release-automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Revalidate and publish GitHub release
        id: release
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          version="$(python release-automation/scripts/release_automation.py publish \
            --repository "$RELEASE_REPOSITORY" \
            --pull-request-number "$RELEASE_PULL_REQUEST")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: finalize
    name: Build ${{ matrix.suffix }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: api
            dockerfile: deploy/Dockerfile.api
          - suffix: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - name: Check out merged release
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          path: source

      - name: Compute image name
        id: image
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.base }}-${{ matrix.suffix }}:${{ needs.finalize.outputs.version }}

  promote:
    needs: [finalize, build]
    name: Promote latest aliases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: release-automation

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify tag remains newest
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.finalize.outputs.version }}
        run: >-
          python release-automation/scripts/release_automation.py verify-promotion
          --repository "$RELEASE_REPOSITORY"
          --version "$RELEASE_VERSION"

      - name: Compute image name
        id: image
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify both versioned manifests
        env:
          IMAGE_BASE: ${{ steps.image.outputs.base }}
          RELEASE_VERSION: ${{ needs.finalize.outputs.version }}
        shell: bash
        run: |
          docker buildx imagetools inspect "$IMAGE_BASE-api:$RELEASE_VERSION" >/dev/null
          docker buildx imagetools inspect "$IMAGE_BASE-web:$RELEASE_VERSION" >/dev/null

      - name: Repoint latest aliases without rebuilding
        env:
          IMAGE_BASE: ${{ steps.image.outputs.base }}
          RELEASE_VERSION: ${{ needs.finalize.outputs.version }}
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_BASE-api:latest" \
            "$IMAGE_BASE-api:$RELEASE_VERSION"
          docker buildx imagetools create \
            --tag "$IMAGE_BASE-web:latest" \
            "$IMAGE_BASE-web:$RELEASE_VERSION"

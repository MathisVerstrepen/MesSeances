name: VPS CI validation

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/ci-vps.yml
      - deploy/ci/outrunner/**

permissions:
  contents: read

concurrency:
  group: vps-ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: VPS CI / deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          for script in deploy/ci/outrunner/*.sh; do
            bash -n "$script"
          done
      - name: Test VM disposal safeguards
        run: python3 -B -m unittest discover -s deploy/ci/outrunner/tests -v
  validate:
    # This routing condition is not an isolation boundary: repository-side
    # external-contributor approval and host firewall/VM isolation are required.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: VPS CI / isolation and integration
    runs-on: messeances-vps
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify disposable VM isolation and toolchains
        run: bash deploy/ci/outrunner/smoke.sh
      - name: Prepare application dependencies
        working-directory: api
        run: go mod download
      - name: Install pinned test reporter
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate.py install-tools --tool gotestsum
      - name: PostgreSQL integration tests
        run: make test-integration
      - name: Verify private validation evidence
        run: python3 -B deploy/ci/outrunner/verify-evidence.py

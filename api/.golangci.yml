version: "2"

run:
  build-tags: [nodynamic]
  relative-path-mode: gomod
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - loggercheck
    - noctx
    - promlinter
    - rowserrcheck
    - sloglint
    - staticcheck
    - unused
  exclusions:
    warn-unused: true
    rules:
      # Go 1.26 net/http requires *crypto/tls.Conn to negotiate HTTP/2, but our
      # custom uTLS dialer returns *utls.UConn. Keep x/net's transport and timeout
      # fields to preserve fingerprinted HTTP/2; exempt only these deprecations.
      - path: ^internal/(syncproxy/proxy(_test)?|kinepolis/client_test)\.go$
        text: '^SA1019: (golang\.org/x/net/http2\.Transport|\(golang\.org/x/net/http2\.Transport\)\.(DialTLSContext|IdleConnTimeout|ReadIdleTimeout|PingTimeout|WriteByteTimeout)) is deprecated: '
        linters:
          - staticcheck
      - path: ^internal/ign/client_test\.go$
        source: 'response:\s+response\('
        linters:
          - bodyclose
      - path: ^internal/pathe/client_test\.go$
        source: '^\s*\{".*", testJSONResponse\('
        linters:
          - bodyclose
      - path: ^internal/pathe/client_test\.go$
        source: '^\s*\}\(\), CategoryContentType\},$'
        linters:
          - bodyclose
      - path: ^internal/pathe/client_test\.go$
        source: '^\s*response := testJSONResponse\('
        linters:
          - bodyclose
      - path: ^internal/syncproxy/proxy\.go$
        source: 'http\.ReadResponse\(reader, request\)'
        linters:
          - bodyclose
      - path: ^internal/syncschedule/service\.go$
        text: 'SA2001: empty critical section'
        linters:
          - staticcheck
      - path: ^internal/kinepolis/parser\.go$
        source: 'fmt\.Errorf\("Drupal settings JSON not found or malformed"\)'
        linters:
          - staticcheck
      - path: ^internal/pathe/sync\.go$
        source: 'errors\.New\("Pathé phase canceled"\)'
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

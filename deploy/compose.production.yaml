name: messeances-production

x-journald-logging: &journald-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *journald-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movieflow}
      POSTGRES_USER: ${POSTGRES_USER:-movieflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  umami-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *journald-logging
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB:-umami}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}
    volumes:
      - umami_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  umami:
    image: ${UMAMI_IMAGE:?UMAMI_IMAGE is required}
    restart: unless-stopped
    logging: *journald-logging
    init: true
    depends_on:
      umami-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER:-umami}:${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}@umami-postgres:5432/${UMAMI_POSTGRES_DB:-umami}
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET is required}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_ENCRYPTION_KEY:?UMAMI_TWO_FACTOR_ENCRYPTION_KEY is required}
    ports:
      - "127.0.0.1:${UMAMI_PUBLISHED_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  umami-retention:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *journald-logging
    depends_on:
      umami-postgres:
        condition: service_healthy
    environment:
      PGHOST: umami-postgres
      PGDATABASE: ${UMAMI_POSTGRES_DB:-umami}
      PGUSER: ${UMAMI_POSTGRES_USER:-umami}
      PGPASSWORD: ${UMAMI_POSTGRES_PASSWORD:?UMAMI_POSTGRES_PASSWORD is required}
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - type: bind
        source: ${PWD:?run production Compose from the repository root}/deploy/umami-retention.sql
        target: /retention/umami-retention.sql
        read_only: true
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          psql --no-password --no-psqlrc --set=ON_ERROR_STOP=1 --quiet --file=/retention/umami-retention.sql
          date +%s > /tmp/umami-retention-last-success
          sleep 86400
        done
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/umami-retention-last-success && test $$(($$(date +%s) - $$(cat /tmp/umami-retention-last-success))) -lt 90000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

  api:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}-api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *journald-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-movieflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-movieflow}?sslmode=disable
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:?INTERNAL_API_SHARED_SECRET is required}
      PROXY_FILE: /run/secrets/sync-proxies.txt
      SYNC_REQUEST_TIMEOUT: ${SYNC_REQUEST_TIMEOUT:-20s}
      SYNC_KINEPOLIS_REQUEST_INTERVAL: ${SYNC_KINEPOLIS_REQUEST_INTERVAL:-2s}
      SYNC_OPERATION_TIMEOUT: ${SYNC_OPERATION_TIMEOUT:-2m}
      PORT: "8080"
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    volumes:
      - type: bind
        source: ${PROXY_FILE_HOST:?PROXY_FILE_HOST is required}
        target: /run/secrets/sync-proxies.txt
        read_only: true
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s

  web:
    image: ${IMAGE_BASE:?IMAGE_BASE is required}-web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    logging: *journald-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_INTERNAL_API_SHARED_SECRET: ${INTERNAL_API_SHARED_SECRET:?INTERNAL_API_SHARED_SECRET is required}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:?NUXT_PUBLIC_API_BASE is required}
      NUXT_PUBLIC_SITE_URL: ${WEB_ORIGIN:?WEB_ORIGIN is required}
      NUXT_PUBLIC_UMAMI_SCRIPT_URL: ${NUXT_PUBLIC_UMAMI_SCRIPT_URL:-}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${NUXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_data:
  umami_postgres_data:
